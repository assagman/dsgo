# DSGo YAML Pipeline Definition
# This file defines a multi-stage pipeline for text processing
# demonstrating the YAML-based program builder pattern.

name: text_analysis_pipeline
description: A pipeline that analyzes text for sentiment and generates a summary

# Global settings for the pipeline
settings:
  temperature: 0.7
  max_tokens: 10240

# Define reusable signatures
signatures:
  sentiment_analysis:
    description: Analyze the sentiment of the provided text
    inputs:
      - name: text
        type: string
        description: The text to analyze for sentiment
    outputs:
      - name: sentiment
        type: class
        description: The detected sentiment
        classes: [positive, negative, neutral]
      - name: confidence
        type: float
        description: Confidence score between 0 and 1

  key_points_extraction:
    description: Extract key points from the analyzed text
    inputs:
      - name: text
        type: string
        description: The original text
      - name: sentiment
        type: string
        description: The detected sentiment from previous analysis
    outputs:
      - name: key_points
        type: string
        description: Bullet-pointed list of key points
      - name: word_count
        type: int
        description: Number of words in original text

  summary_generation:
    description: Generate a comprehensive summary based on sentiment and key points
    inputs:
      - name: text
        type: string
        description: The original text
      - name: sentiment
        type: string
        description: The detected sentiment
      - name: key_points
        type: string
        description: The extracted key points
    outputs:
      - name: summary
        type: string
        description: A comprehensive summary of the text
      - name: recommendations
        type: string
        description: Actionable recommendations based on the analysis

# Define modules that use the signatures
modules:
  sentiment_analyzer:
    type: Predict
    signature: sentiment_analysis
    options:
      temperature: 0.3

  key_points_extractor:
    type: ChainOfThought
    signature: key_points_extraction
    options:
      temperature: 0.5
      max_tokens: 512

  summary_generator:
    type: ChainOfThought
    signature: summary_generation
    options:
      temperature: 0.7
      max_tokens: 1024

# Define the pipeline as a sequence of modules
pipeline:
  - module: sentiment_analyzer
  - module: key_points_extractor
  - module: summary_generator

# Pipeline inputs
inputs:
  text: |
    The new AI-powered code review system has significantly improved our development workflow.
    The automated suggestions are remarkably accurate, catching potential bugs before they reach production.
    Team productivity has increased by approximately 30% since implementation.
    
    However, there are some concerns about the learning curve for junior developers who may become
    overly reliant on AI suggestions without fully understanding the underlying code patterns.
    Additionally, the system occasionally generates false positives, which can slow down the review process.
    
    Overall, the benefits outweigh the drawbacks, and we recommend continued adoption with appropriate
    training and guidelines for the development team.
