# DSGo YAML Pipeline for Web Search and Summarization
# This pipeline can search the web or extract content from a specific URL
# and then provide an elegant, structured summary.
#
# Requires: TAVILY_API_KEY environment variable
#
# To run this example:
#   export TAVILY_API_KEY=your-tavily-api-key
#   go run . pipeline_web_summary.yaml

name: web_summarizer_pipeline
description: Search, extract, and summarize web content elegantly

settings:
  temperature: 0.5
  max_tokens: 4096

mcp:
  tavily:
    type: tavily

signatures:
  web_summarization:
    description: Search for information or extract content from a URL and provide a structured summary
    inputs:
      - name: target
        type: string
        description: A search query or a specific URL to summarize
    outputs:
      - name: title
        type: string
        description: A concise, catchy title for the summary
      - name: summary
        type: string
        description: An elegant and comprehensive summary of the findings
      - name: key_points
        type: string
        description: Bullet points of the most important facts
      - name: analysis
        type: string
        description: Deep analysis or implications of the information
      - name: sources
        type: string
        description: List of URLs and sources used

modules:
  research_agent:
    type: ReAct
    signature: web_summarization
    options:
      temperature: 0.2
      max_iterations: 10
    mcp:
      tavily:
        tools:
          - "*"

pipeline:
  - module: research_agent

inputs:
  target: "https://openai.com/index/developers-can-now-submit-apps-to-chatgpt/"
