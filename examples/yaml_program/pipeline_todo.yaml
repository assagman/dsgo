# DSGo YAML Pipeline: Task -> Codebase analysis -> Web research -> TODO list
#
# Input: task
# Flow:
#   task -> codebase_analysis -> web_research -> todo
#
# Requires:
#   - TAVILY_API_KEY for web search/extraction (MCP)
#   - Node.js (npx) or Bun (bunx) for filesystem MCP server
#
# Run:
#   export TAVILY_API_KEY=your-key
#   go run . pipeline_todo.yaml

name: pipeline_todo
description: Project TODO list generation via codebase analysis and web research

model:
  name: openrouter/z-ai/glm-4.6
  temperature: 0.4
  max_tokens: 8192

dsgo:
  timeouts:
    pipeline: 45m
    lm_http: 15m
    mcp_http: 10m

# Define MCP clients (global registry)
mcp:
  tavily:
    type: tavily
  filesystem:
    type: filesystem
    allowed_dirs:
      - .

signatures:
  codebase_analysis:
    description: Analyze the current repository to locate files and implementation approach
    inputs:
      - name: task
        type: string
        description: Task to perform in this repository
    outputs:
      - name: codebase_notes
        type: string
        description: Repo-specific findings (entry points, constraints, suggested approach)
      - name: files_examined
        type: string
        description: Files/dirs examined (paths)

  web_research:
    description: Research the task on the web based on codebase analysis findings
    inputs:
      - name: task
        type: string
        description: Task to perform in a codebase
      - name: codebase_notes
        type: string
        description: Codebase analysis notes to guide research
        optional: true
      - name: files_examined
        type: string
        description: Files examined in the codebase
        optional: true
    outputs:
      - name: research_notes
        type: string
        description: Practical notes (best practices, pitfalls, relevant APIs), tailored to the task and codebase
      - name: sources
        type: string
        description: 5-12 URLs with a 1-line relevance note each

  write_todo:
    description: Produce a flat, actionable TODO list for implementing the task
    inputs:
      - name: task
        type: string
        description: The original task
      - name: research_notes
        type: string
        description: Web research notes
        optional: true
      - name: codebase_notes
        type: string
        description: Repo analysis notes
    outputs:
      - name: todo
        type: string
        description: |
          Output ONLY a numbered TODO list.
          One item per line, in order, starting with "1.".
          No headings, no grouping, no blank lines.
          Make items actionable and repo-specific.
          Mention file paths and commands when appropriate.

modules:
  researcher:
    type: ReAct
    signature: web_research
    model: openrouter/google/gemini-2.5-flash
    options:
      temperature: 0.3
      max_tokens: 4096
      max_iterations: 10
      verbose: true
    mcp:
      tavily:
        tools:
          - "*"

  analyzer:
    type: ReAct
    signature: codebase_analysis
    model: openrouter/openai/gpt-5.2
    options:
      temperature: 0.4
      max_tokens: 4096
      max_iterations: 12
      verbose: true
    mcp:
      filesystem:
        tools:
          - "*"

  todo_writer:
    type: ChainOfThought
    signature: write_todo
    model: openrouter/z-ai/glm-4.6
    options:
      temperature: 0.2
      max_tokens: 2048

pipeline:
  - module: analyzer
  - module: researcher
  - module: todo_writer

inputs:
  task: |
    Review project code quality
