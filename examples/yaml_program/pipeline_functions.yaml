# DSGo YAML Pipeline Definition with Function Tools
# This file demonstrates ReAct with native Go function tools.
# No API keys required - works completely offline.

name: assistant_pipeline
description: A pipeline that answers questions using built-in utility tools

# Global settings for the pipeline
settings:
  temperature: 0.7
  max_tokens: 4096

# Define function tools (native Go implementations)
tools:
  get_datetime:
    type: function
    name: current_datetime

  calculator:
    type: function
    name: calculate

  random:
    type: function
    name: random_number

  text_analyzer:
    type: function
    name: word_count

  env_info:
    type: function
    name: environment_info

  list_files:
    type: filesystem
    name: list_files

  read_file:
    type: filesystem
    name: read_file

# Define reusable signatures
signatures:
  assistant:
    description: Answer questions using available tools
    inputs:
      - name: question
        type: string
        description: The question to answer
    outputs:
      - name: answer
        type: string
        description: The answer to the question
      - name: tools_used
        type: string
        description: Which tools were used to find the answer

  analysis:
    description: Analyze text or numbers
    inputs:
      - name: task
        type: string
        description: The analysis task to perform
      - name: data
        type: string
        description: The data to analyze
    outputs:
      - name: result
        type: string
        description: Analysis result
      - name: method
        type: string
        description: Method used for analysis

# Define modules that use the signatures
modules:
  assistant:
    type: ReAct
    signature: assistant
    options:
      temperature: 0.5
      max_iterations: 6
      tools:
        - get_datetime
        - calculator
        - random
        - text_analyzer
        - env_info
        - list_files
        - read_file

  analyzer:
    type: ReAct
    signature: analysis
    options:
      temperature: 0.3
      max_iterations: 5
      tools:
        - calculator
        - text_analyzer

# Define the pipeline as a sequence of modules
pipeline:
  - module: assistant

# Pipeline inputs
inputs:
  question: "What is the current date and time? Also calculate 25 * 4 + 100."
